# CI for the Rust workspace: the four checks every crate shares
# (spec/01-family-policy/index.md §1.2), the MSRV floor
# (spec/rust-msrv-n-minus-3/index.md), the trademark fair-use rules
# (spec/hl7-trademarks-fair-use/index.md, enforced by bin/check-trademarks),
# and dependency auditing (deny.toml: advisories, licenses, bans, sources).
# The same auditing check also runs on a weekly cron with no push required
# — .github/workflows/audit.yml — so a newly-disclosed advisory against
# something already in Cargo.lock is caught even in a quiet week.
#
# The site is not built here: it deploys from the er7-rust.github.io
# repository this monorepo's er7-rust.github.io/ subdirectory is split
# into, and that repository carries its own workflow.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, for when a push event is dropped — GitHub Actions'
  # 2026-08-26 outage swallowed this workflow's would-be first hosted
  # run, and without this there is no way to start one except another
  # push.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The four checks from spec/01-family-policy/index.md §1.2, verbatim.
  # `cargo rustdoc --lib` needs one package at a time, so the fourth
  # check runs once per library crate.
  #
  # Split into two phases with a `cargo clean` between them, deliberately:
  # er7-bench's only dev-dependency is criterion, which alone pulls in
  # roughly 50 transitive crates that the three published crates' own
  # test/clippy/doc steps never touch. Measured 2026-08-27 with a clean
  # target/ before each: phase 1 alone (the three published crates, all
  # four checks) peaks at 226 MiB; phase 2 alone (er7-bench, criterion and
  # all) peaks at 215 MiB; run together with nothing cleaned between them,
  # the old single-phase shape this replaced peaked at 391 MiB. Splitting
  # roughly halves the job's peak disk footprint rather than summing the
  # two. (A package-scoped `cargo clean -p er7-bench` was tried first and
  # rejected: it only frees that package's own output, not its exclusive
  # dependency tree, so it does not touch criterion at all.) Nothing after
  # phase 2 needs the disk back — the runner is discarded at the end of
  # the job either way — so there is no cleanup step after phase 2.
  checks:
    name: the four checks
    runs-on: ubuntu-latest
    steps:
      - name: free preinstalled runner bloat
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/node_modules 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Phase 1: the three published crates. No criterion anywhere in this
      # phase's dependency graph.
      - run: cargo test -p er7 -p er7-redact -p serde-er7
      - run: cargo clippy -p er7 -p er7-redact -p serde-er7 --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo rustdoc -p er7 --lib -- -W missing-docs
      - run: cargo rustdoc -p serde-er7 --lib -- -W missing-docs
      - run: cargo rustdoc -p er7-redact --lib -- -W missing-docs
      - name: clean phase 1's target/ before building criterion
        run: cargo clean
      # Phase 2: er7-bench, isolated so its criterion-sized target/ never
      # coexists on disk with phase 1's.
      - run: cargo test -p er7-bench
      - run: cargo clippy -p er7-bench --all-targets -- -D warnings

  # The declared floor (rust-version in every publishable crate's own
  # Cargo.toml) actually builds and tests, so the pin cannot silently
  # drift from the real minimum — closes er7 spec §17 task T2. The value
  # is read from the manifest rather than hard-coded here, per that
  # task's own "done when": a future MSRV bump only ever needs editing in
  # one place. (The job's *display name* below stays a fixed string —
  # GitHub Actions renders job names before any step runs, so it cannot
  # reference a step's output; a stale label here is a readability papercut,
  # not the silent-drift problem this job exists to close, since the
  # toolchain it actually installs is never hard-coded.)
  msrv:
    name: msrv (from er7/Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - name: free preinstalled runner bloat
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/node_modules 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
      - name: read the pinned MSRV, and confirm all three crates agree
        id: msrv
        run: |
          er7=$(grep -m1 '^rust-version' er7/Cargo.toml | grep -oE '[0-9]+\.[0-9]+')
          redact=$(grep -m1 '^rust-version' er7-redact/Cargo.toml | grep -oE '[0-9]+\.[0-9]+')
          serde=$(grep -m1 '^rust-version' serde-er7/Cargo.toml | grep -oE '[0-9]+\.[0-9]+')
          if [ "$er7" != "$redact" ] || [ "$er7" != "$serde" ]; then
            echo "::error::rust-version disagrees across crates: er7=$er7 er7-redact=$redact serde-er7=$serde"
            exit 1
          fi
          echo "version=$er7" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  # The three fuzz targets under er7/fuzz/ — a build plus a brief smoke
  # run over each, not a fuzzing campaign: it proves the targets still
  # compile and run. er7/fuzz/ is deliberately its own workspace (its
  # Cargo.toml explains why), so the jobs above never touch it.
  #
  # libfuzzer-sys needs nightly. rustfmt and clippy are named explicitly:
  # dtolnay/rust-toolchain installs a minimal toolchain, and the fmt and
  # clippy steps below run on nightly (the only toolchain this job
  # installs) — without the components both fail with "'cargo-fmt' is not
  # installed for the toolchain 'nightly'".
  fuzz:
    name: fuzz targets (build + smoke run)
    runs-on: ubuntu-latest
    steps:
      - name: free preinstalled runner bloat
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/node_modules 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            er7/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('er7/fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-
      - run: cargo install cargo-fuzz --locked || true
      - run: cargo fmt --all -- --check
        working-directory: er7/fuzz
      - run: cargo +nightly clippy --all-targets -- -D warnings
        working-directory: er7/fuzz
      - run: cargo +nightly fuzz build
        working-directory: er7/fuzz
      # corpus/ is generated and gitignored, so it does not exist in a
      # fresh checkout; libFuzzer errors on a missing corpus directory
      # rather than creating one.
      - name: run each target briefly
        working-directory: er7/fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            mkdir -p "corpus/$target"
            cargo +nightly fuzz run "$target" "corpus/$target" -- \
              -max_total_time=20 -rss_limit_mb=4096 -timeout=10
            echo "::endgroup::"
          done

  # Rules T1, T2, and T3 of spec/hl7-trademarks-fair-use/index.md,
  # across every page in the tree. No Rust build here, so no disk-headroom
  # step: the runner's default free space comfortably covers a checkout
  # and a Python script.
  trademarks:
    name: trademarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bin/check-trademarks

  # deny.toml governs advisories, licenses, bans, and sources — checked
  # against both workspaces in this repository: the root one, and
  # er7/fuzz's own [workspace] (its Cargo.toml explains why it is
  # separate). cargo-deny finds deny.toml by walking up from either.
  # No disk-headroom step here either: cargo-deny resolves the dependency
  # graph and downloads the advisory database, it does not compile
  # anything, and the default runner has ample room for that alone.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: er7/fuzz/Cargo.toml
