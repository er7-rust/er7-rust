<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Theme resolution runs synchronously, before any stylesheet paints, so
      there is no flash from the light default to a stored or OS-preferred
      dark theme. It mirrors lily-design-system-svelte-theme-picker's own
      resolution order (storage, then system, then "light") exactly, so
      the ThemePicker in +layout.svelte agrees with this on first render
      rather than overriding it.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lily-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="stylesheet" href="%sveltekit.assets%/assets/style.css" />
    <!-- Both themes preload so switching data-theme applies instantly,
         with no per-switch network fetch. Each file scopes its rules to
         :root[data-theme="…"], so loading both is inert until selected. -->
    <link rel="stylesheet" href="%sveltekit.assets%/assets/themes/light.css" />
    <link rel="stylesheet" href="%sveltekit.assets%/assets/themes/dark.css" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
