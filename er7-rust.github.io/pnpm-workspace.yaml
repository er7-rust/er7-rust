# Not a real multi-package workspace — this file exists only to hold
# allowBuilds/overrides below, which this pnpm version reads from here,
# not package.json. But once the file exists at all, pnpm requires a
# non-empty packages list (`ERROR packages field missing or empty` on
# e.g. `pnpm store path`, which actions/setup-node's cache step runs) —
# this is that one package, itself.
packages:
  - '.'

allowBuilds:
  esbuild: true
